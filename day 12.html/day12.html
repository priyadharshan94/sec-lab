<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //definition:
        //a set is a collection of UNIQUE VALUES.It automatically removes duplicates
        let email=new Set([]);
        email.add("js.gmail.com");
        email.add("java.gmail.com");
        email.add("py@gmail.com");
        console.log(email)
       
        for(let mailid of email){
            console.log(mailid)
        }
        email.forEach(x=>{
            console.log(x)
        })
        let admin=new Set(["write","read","delete"]);
        let user=new Set(["read"]);

        function haspermission(role,granted){
            return role.has(granted)
        }
        console.log(haspermission(admin,"delete"));
        console.log(haspermission(user,"delete"));
        let setA=new Set([1,2,3,4,5,1]);
        let setB=new Set([6,7,8,9,10,1]);
        let union=new Set([...setA,...setB])
        console.log(union);
        let intersection=new Set([...setA].filter[x=>!setB.has(x)])
        console.log(intersection)
        let diff=new Set([...setA].filter[x=>!setB.has(x)])
        console.log(diff)
        //def:
        //returns a new iterator object with[value,value]pairs
        //this is because a set has no seperate keys only value
        let fruits=new Set(["Apple","banana"]);
        let entries=fruits.entries();
        for(let entry of entries){
            console.log(entry);
        }
        //weakmap
        //a javascript weak map is a collection of key value pairs in where the keys must be objects
        let user1={name:"java"}
        let user2={name:"python"}
        let mymap=new WeakMap();
        mymap.set(user1,"welcome");
        mymap.set(user2,"welcome python!");
        console.log(mymap.get(user1));
        
    </script>
      
</body>
</html>
